# chrono-ci: owned github-release/v1
name: "chrono-release-build"
on:
  workflow_run:
    workflows: ["chrono / collection"]
    branches: ["dev"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source:
        description: Source revision to check out
        required: true
        type: string
      channel:
        description: Build artifacts or publish a verified source
        type: choice
        default: build
        options: [build, preview, stable]
      verified_run:
        description: Successful landing CI run ID
        type: string
      verified_attempt:
        description: Original successful CI attempt
        type: string
      version:
        description: Explicit stable version matching the source plan
        type: string
permissions:
  contents: read
jobs:
  linux_build_runner:
    if: ${{ github.event.deleted != true && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) }}
    needs: ["linux_release_frontend"]
    runs-on: "ubuntu-24.04"
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.release_upload.outputs.artifact-id }}
      run_id: ${{ steps.release_identity.outputs.run_id }}
      attempt: ${{ steps.release_identity.outputs.attempt }}
    steps:
      - name: Check out requested release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.source || github.sha }}
          fetch-depth: 0
      - name: Bind original producing attempt
        id: release_identity
        if: ${{ always() }}
        shell: bash
        env:
          RELEASE_RUN: ${{ github.run_id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          printf 'run_id=%s\nattempt=%s\n' "$RELEASE_RUN" "$RELEASE_ATTEMPT" >> "$GITHUB_OUTPUT"
      - &chrono_release_download_11
        name: Download selected original artifact from linux_release_frontend
        if: ${{ always() && needs.linux_release_frontend.outputs.artifact_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.linux_release_frontend.outputs.artifact_id }}
          merge-multiple: true
          path: ".chrono-harness/cache/release-frontend/"
      - name: Prepare registered caches
        id: chrono_cache_plan
        shell: bash
        run: |
          '/bin/bash' '.chrono-harness/ci/bootstrap-native.sh' '.' '.chrono-harness/ci/bootstrap-cache.json'
          '.chrono-harness/bin/chrono-cache' plan --host-root . --config '.chrono-harness/cache.json' --consumer 'release.linux_build_runner' --plan-output '.chrono-harness/state/cache/release.linux_build_runner/plan.json' --github-output "$GITHUB_OUTPUT"
      - name: Restore registered cache release.linux.release.runner
        id: cache_0_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_0_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_0_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_0_restore }}
          fail-on-cache-miss: false
      - name: Recover failed cache restores
        if: ${{ steps.chrono_cache_plan.outputs.cache_recovery == 'discard-failed-host-restores' }}
        shell: bash
        env:
          CHRONO_CACHE_RESTORE_STEPS: ${{ toJSON(steps) }}
        run: |
          '.chrono-harness/bin/chrono-cache' recover --host-root . --config '.chrono-harness/cache.json' --plan '.chrono-harness/state/cache/release.linux_build_runner/plan.json' --steps-env CHRONO_CACHE_RESTORE_STEPS
      - name: Run registered release command
        id: chrono_cache_work
        if: ${{ always() }}
        shell: bash
        env:
          CHRONO_RELEASE_DEPENDENCIES: ${{ toJson(needs) }}
          CHRONO_RELEASE_RUN: ${{ github.run_id }}
          CHRONO_RELEASE_ATTEMPT: ${{ github.run_attempt }}
          CHRONO_RELEASE_JOB: "linux_build_runner"
          CHRONO_RELEASE_CHANNEL: ${{ github.event_name == 'workflow_run' && 'preview' || inputs.channel || 'build' }}
          CHRONO_RELEASE_SOURCE: ${{ github.event.workflow_run.head_sha || inputs.source }}
          CHRONO_RELEASE_CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.verified_run }}
          CHRONO_RELEASE_CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.verified_attempt }}
          CHRONO_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          '/usr/bin/env' 'CARGO_HOME=.chrono-harness/cache/bootstrap-owner-tooling/cargo' '/bin/bash' '.chrono-harness/release/consume.sh' '.' '.chrono-harness/cache/release-frontend' '.chrono-harness/cache/release-results/build_runner' '--unit' 'build_runner'
      - name: Seal producer cache contents
        id: chrono_cache_seal
        if: ${{ always() && !cancelled() && steps.chrono_cache_plan.outputs.cache_content_verification == 'producer-manifest/v1' }}
        shell: bash
        env:
          CHRONO_CACHE_PRODUCER_STEPS: ${{ toJSON(steps) }}
        run: |
          '.chrono-harness/bin/chrono-cache' seal --host-root . --config '.chrono-harness/cache.json' --plan '.chrono-harness/state/cache/release.linux_build_runner/plan.json' --steps-env CHRONO_CACHE_PRODUCER_STEPS --work 'chrono_cache_work' --github-output "$GITHUB_OUTPUT"
      - name: Save registered cache release.linux.release.runner
        id: cache_0_save
        if: ${{ always() && !cancelled() && steps.chrono_cache_plan.outcome == 'success' && (steps.chrono_cache_work.outcome == 'success' || (steps.chrono_cache_plan.outputs.cache_0_save_on_failure == 'true' && steps.chrono_cache_work.outcome == 'failure')) && steps.cache_0_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_0_key && (steps.chrono_cache_plan.outputs.cache_0_verification != 'producer-manifest/v1' || steps.chrono_cache_seal.outputs.cache_0_sealed == 'true') }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_0_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_0_paths }}
      - name: Preserve original release artifacts
        id: release_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "chrono-release-linux-build_runner-${{ github.run_id }}-${{ github.run_attempt }}"
          path: ".chrono-harness/cache/release-results/build_runner/"
          if-no-files-found: error
          include-hidden-files: true
      - name: Preserve failed cache diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "diagnostics-chrono-release-linux-build_runner-${{ github.run_id }}-${{ github.run_attempt }}"
