# chrono-ci: owned github-release/v1
name: "chrono-release-build"
on:
  push:
    branches: ["integration/distribution","integration/release-ci","integration/release-units"]
  workflow_dispatch:
    inputs:
      source:
        description: Source revision to check out
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  linux_build_runner:
    if: ${{ github.event.deleted != true }}
    runs-on: "ubuntu-24.04"
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.release_upload.outputs.artifact-id }}
      run_id: ${{ steps.release_identity.outputs.run_id }}
      attempt: ${{ steps.release_identity.outputs.attempt }}
    steps:
      - name: Check out requested release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source || github.sha }}
          fetch-depth: 0
      - name: Bind original producing attempt
        id: release_identity
        if: ${{ always() }}
        shell: bash
        env:
          RELEASE_RUN: ${{ github.run_id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          printf 'run_id=%s\nattempt=%s\n' "$RELEASE_RUN" "$RELEASE_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Prepare registered caches
        id: chrono_cache_plan
        shell: bash
        run: |
          'python3' '.chrono-harness/ci/bootstrap.py' '.' '.chrono-harness/ci/bootstrap-cache.json'
          '.chrono-harness/bin/chrono-cache-transport' plan --host-root . --config '.chrono-harness/cache.json' --consumer 'release.linux_build_runner' --plan-output '.chrono-harness/state/cache/release.linux_build_runner/plan.json' --github-output "$GITHUB_OUTPUT"
      - name: Restore registered cache release.linux.release.runner
        id: cache_0_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_0_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_0_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_0_restore }}
          fail-on-cache-miss: false
      - name: Recover failed cache restores
        if: ${{ steps.chrono_cache_plan.outputs.cache_recovery == 'discard-failed-host-restores' }}
        shell: bash
        env:
          CHRONO_CACHE_RESTORE_STEPS: ${{ toJSON(steps) }}
        run: |
          '.chrono-harness/bin/chrono-cache-transport' recover --host-root . --config '.chrono-harness/cache.json' --plan '.chrono-harness/state/cache/release.linux_build_runner/plan.json' --steps-env CHRONO_CACHE_RESTORE_STEPS
      - name: Run registered release command
        id: chrono_cache_work
        if: ${{ always() }}
        shell: bash
        env:
          CHRONO_RELEASE_DEPENDENCIES: ${{ toJson(needs) }}
          CHRONO_RELEASE_RUN: ${{ github.run_id }}
          CHRONO_RELEASE_ATTEMPT: ${{ github.run_attempt }}
          CHRONO_RELEASE_JOB: "linux_build_runner"
        run: |
          'python3' '.chrono-harness/release/build.py' '.' '.chrono-harness/cache/release-results/build_runner' '--unit' 'build_runner'
      - name: Save registered cache release.linux.release.runner
        id: cache_0_save
        if: ${{ always() && !cancelled() && steps.chrono_cache_plan.outcome == 'success' && steps.chrono_cache_work.outcome == 'success' && steps.cache_0_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_0_key }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_0_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_0_paths }}
      - name: Record original cache transport observations
        if: ${{ always() && steps.chrono_cache_plan.outcome == 'success' }}
        shell: bash
        env:
          CHRONO_CACHE_STEPS: ${{ toJSON(steps) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          '.chrono-harness/bin/chrono-cache-transport' report --host-root . --plan '.chrono-harness/state/cache/release.linux_build_runner/plan.json' --report-directory '.chrono-harness/cache/release-results/build_runner/cache-observations/' --steps-env CHRONO_CACHE_STEPS --work 'chrono_cache_work'
      - name: Preserve original release artifacts
        id: release_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "chrono-release-linux-build_runner-${{ github.run_id }}-${{ github.run_attempt }}"
          path: ".chrono-harness/cache/release-results/build_runner/"
          if-no-files-found: error
          include-hidden-files: true
