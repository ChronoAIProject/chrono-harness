          '.chrono-harness/bin/chrono-cache-transport' recover --host-root . --config '.chrono-harness/cache.json' --plan '.chrono-harness/state/cache/release.macos_verify_cache_tests/plan.json' --steps-env CHRONO_CACHE_RESTORE_STEPS
      - name: Run registered release command
        id: chrono_cache_work
        if: ${{ always() }}
        shell: bash
        env:
          CHRONO_RELEASE_DEPENDENCIES: ${{ toJson(needs) }}
          CHRONO_RELEASE_RUN: ${{ github.run_id }}
          CHRONO_RELEASE_ATTEMPT: ${{ github.run_attempt }}
          CHRONO_RELEASE_JOB: "macos_verify_cache_tests"
        run: |
          'python3' '.chrono-harness/release/build.py' '.' '.chrono-harness/cache/release-results/verify_cache_tests' '--unit' 'verify_cache_tests'
      - name: Save registered cache release.macos.verify.cache-tests
        id: cache_0_save
        if: ${{ always() && !cancelled() && steps.chrono_cache_plan.outcome == 'success' && steps.chrono_cache_work.outcome == 'success' && steps.cache_0_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_0_key }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_0_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_0_paths }}
      - name: Record original cache transport observations
        if: ${{ always() && steps.chrono_cache_plan.outcome == 'success' }}
        shell: bash
        env:
          CHRONO_CACHE_STEPS: ${{ toJSON(steps) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          '.chrono-harness/bin/chrono-cache-transport' report --host-root . --plan '.chrono-harness/state/cache/release.macos_verify_cache_tests/plan.json' --report-directory '.chrono-harness/cache/release-results/verify_cache_tests/cache-observations/' --steps-env CHRONO_CACHE_STEPS --work 'chrono_cache_work'
      - name: Preserve original release artifacts
        id: release_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "chrono-release-macos-verify_cache_tests-${{ github.run_id }}-${{ github.run_attempt }}"
          path: ".chrono-harness/cache/release-results/verify_cache_tests/"
          if-no-files-found: error
          include-hidden-files: true
