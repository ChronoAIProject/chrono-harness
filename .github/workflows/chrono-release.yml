# chrono-ci: owned github-release/v1
name: "chrono-native-runtime-profile"
on:
  workflow_dispatch:
    inputs:
      source:
        description: Source revision to check out
        required: true
        type: string
permissions:
  contents: read
jobs:
  native_runtime_profile:
    if: ${{ github.event.deleted != true }}
    runs-on: "macos-26"
    timeout-minutes: 45
    steps:
      - name: Check out requested release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source || github.sha }}
          fetch-depth: 0
      - name: Run registered release command
        shell: bash
        run: |
          '/usr/bin/python3' '-c' 'exec('"'"'import ctypes, datetime, hashlib, json, os, pathlib, platform, re, selectors, shutil, signal, subprocess, sys, threading, time\n\nROOT = pathlib.Path.cwd().resolve()\nOUT = ROOT / \'"'"'.chrono-harness/state/native-runtime-profile/evidence\'"'"'\nSOURCE = \'"'"'287ce3e4977620ddbf1fff39d1e1ae82dcd5080e\'"'"'\nTREE = \'"'"'500a130719e0e721ed9fdc8b25a317fd4bdd8a96\'"'"'\nTEST = \'"'"'full_units::streamed_large_originals_survive_relocated_collection_finalization_and_delivery\'"'"'\nSTART = time.monotonic()\nPREP_DEADLINE = START + 1650\nENV = {\'"'"'PATH\'"'"': os.defpath, \'"'"'HOME\'"'"': os.environ.get(\'"'"'HOME\'"'"', \'"'"'\'"'"')}\nRECORDS, FILES, SAMPLES = [], [], []\n\ndef sha(path):\n h = hashlib.sha256()\n with open(path, \'"'"'rb\'"'"') as f:\n  for b in iter(lambda: f.read(1048576), b\'"'"'\'"'"'): h.update(b)\n return h.hexdigest()\n\ndef retain(path):\n p = pathlib.Path(path)\n item = {\'"'"'path\'"'"': str(p.relative_to(OUT)), \'"'"'bytes\'"'"': p.stat().st_size, \'"'"'sha256\'"'"': sha(p)}\n FILES.append(item)\n return item\n\ndef write(name, value):\n p = OUT / name\n p.write_text(json.dumps(value, indent=2) + \'"'"'\\n\'"'"')\n return retain(p)\n\ndef terminate(p):\n for sig in (signal.SIGTERM, signal.SIGKILL):\n  try: os.killpg(p.pid, sig)\n  except ProcessLookupError: pass\n  if sig == signal.SIGTERM:\n   try: p.wait(timeout=2)\n   except subprocess.TimeoutExpired: pass\n p.wait(timeout=5)\n\ndef command(name, argv, bound, observe=False, limit=1048576):\n begin = time.monotonic()\n r = {\'"'"'name\'"'"': name, \'"'"'argv\'"'"': argv, \'"'"'cwd\'"'"': str(ROOT), \'"'"'started_monotonic\'"'"': begin,\n  \'"'"'at_seconds\'"'"': begin-START, \'"'"'timeout_seconds\'"'"': bound, \'"'"'output_limit_bytes\'"'"': limit}\n RECORDS.append(r)\n streams = {k: {\'"'"'bytes_observed\'"'"': 0, \'"'"'complete\'"'"': False} for k in (\'"'"'stdout\'"'"',\'"'"'stderr\'"'"')}\n stop = threading.Event()\n def capture():\n  try:\n   with selectors.DefaultSelector() as selector:\n    for key in streams:\n     pipe = getattr(p,key); os.set_blocking(pipe.fileno(),False)\n     selector.register(pipe,selectors.EVENT_READ,key)\n    hashes = {key: hashlib.sha256() for key in streams}\n    with open(OUT/(name+\'"'"'.stdout\'"'"'),\'"'"'wb\'"'"') as stdout, open(OUT/(name+\'"'"'.stderr\'"'"'),\'"'"'wb\'"'"') as stderr:\n     outputs = {\'"'"'stdout\'"'"':stdout,\'"'"'stderr\'"'"':stderr}\n     while selector.get_map() and not stop.is_set():\n      for event,_ in selector.select(.1):\n       key = event.data\n       try: data = os.read(event.fd,65536)\n       except BlockingIOError: continue\n       if not data:\n        selector.unregister(event.fileobj); streams[key][\'"'"'complete\'"'"']=True\n        continue\n       previous=streams[key][\'"'"'bytes_observed\'"'"']; streams[key][\'"'"'bytes_observed\'"'"']+=len(data)\n       hashes[key].update(data)\n       outputs[key].write(data[:max(0,limit-previous)])\n    for key in streams: streams[key][\'"'"'observed_sha256\'"'"']=hashes[key].hexdigest()\n  except BaseException as error:\n   r[\'"'"'capture_error\'"'"']={\'"'"'type\'"'"':type(error).__name__,\'"'"'message\'"'"':str(error)}\n  finally:\n   p.stdout.close(); p.stderr.close()\n p = subprocess.Popen(argv, cwd=ROOT, env=ENV, stdin=subprocess.DEVNULL,\n      stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True)\n r[\'"'"'pid\'"'"'] = p.pid\n reader=threading.Thread(target=capture,daemon=True); reader.start()\n try:\n  if observe: watch(p, begin+bound)\n  else: p.wait(timeout=bound)\n except subprocess.TimeoutExpired:\n  r[\'"'"'timed_out\'"'"'] = True\n  terminate(p)\n except BaseException:\n  terminate(p)\n  raise\n finally:\n  if p.poll() is None: terminate(p)\n  reader.join(timeout=2)\n  if reader.is_alive():\n   r[\'"'"'inherited_stream_cleanup\'"'"']=True; terminate(p); reader.join(timeout=2)\n  if reader.is_alive(): stop.set(); reader.join(timeout=1)\n  r.update(exit_code=p.returncode, seconds=time.monotonic()-begin,\n    finished_monotonic=time.monotonic(), streams=streams)\n  for suffix in (\'"'"'stdout\'"'"', \'"'"'stderr\'"'"'):\n   r[suffix] = retain(OUT / (name+\'"'"'.\'"'"'+suffix))\n  if observe and (OUT/\'"'"'test.timeline.jsonl\'"'"').exists(): retain(OUT/\'"'"'test.timeline.jsonl\'"'"')\n  r[\'"'"'output_cap_reached\'"'"'] = any(s[\'"'"'bytes_observed\'"'"'] > limit for s in streams.values())\n  r[\'"'"'capture_complete\'"'"'] = all(s[\'"'"'complete\'"'"'] for s in streams.values()) and \'"'"'capture_error\'"'"' not in r\n  write(\'"'"'commands.json\'"'"', RECORDS)\n return r\n\ndef checked(name, argv, bound=30):\n remaining=PREP_DEADLINE-time.monotonic() if \'"'"'TEST_BEGIN\'"'"' not in globals() else bound\n if remaining<=0: raise RuntimeError(\'"'"'preparation budget exhausted\'"'"')\n r = command(name, argv, min(bound,remaining))\n if r[\'"'"'exit_code\'"'"'] or r.get(\'"'"'timed_out\'"'"') or r[\'"'"'output_cap_reached\'"'"'] or not r[\'"'"'capture_complete\'"'"']:\n  raise RuntimeError(\'"'"'command failed: \'"'"'+name)\n return (OUT / (name+\'"'"'.stdout\'"'"')).read_text().strip()\n\ndef git(name, *args): return checked(name, [GIT, \'"'"'--no-optional-locks\'"'"', *args])\n\ndef source_identity(label):\n head, tree = git(label+\'"'"'-head\'"'"',\'"'"'rev-parse\'"'"',\'"'"'HEAD\'"'"'), git(label+\'"'"'-tree\'"'"',\'"'"'rev-parse\'"'"',\'"'"'HEAD^{tree}\'"'"')\n status = git(label+\'"'"'-status\'"'"',\'"'"'status\'"'"',\'"'"'--porcelain=v1\'"'"',\'"'"'--untracked-files=normal\'"'"')\n if (head,tree,status) != (SOURCE,TREE,\'"'"'\'"'"'): raise RuntimeError(\'"'"'subject identity/cleanliness mismatch\'"'"')\n raw = git(label+\'"'"'-files\'"'"',\'"'"'ls-tree\'"'"',\'"'"'-rz\'"'"',SOURCE)\n hashes = []\n for entry in raw.split(\'"'"'\\0\'"'"'):\n  if not entry: continue\n  meta, name = entry.split(\'"'"'\\t\'"'"',1)\n  mode, kind, oid = meta.split()\n  p = ROOT / name\n  if kind != \'"'"'blob\'"'"': raise RuntimeError(\'"'"'unsupported subject entry: \'"'"'+name)\n  b = os.readlink(p).encode() if mode == \'"'"'120000\'"'"' else p.read_bytes()\n  if hashlib.sha1(b\'"'"'blob \'"'"'+str(len(b)).encode()+b\'"'"'\\0\'"'"'+b).hexdigest() != oid:\n   raise RuntimeError(\'"'"'subject source bytes mismatch: \'"'"'+name)\n  hashes.append({\'"'"'path\'"'"':name,\'"'"'git_blob\'"'"':oid,\'"'"'mode\'"'"':mode,\'"'"'sha256\'"'"':hashlib.sha256(b).hexdigest(),\'"'"'bytes\'"'"':len(b)})\n result = {\'"'"'head\'"'"':head,\'"'"'tree\'"'"':tree,\'"'"'clean\'"'"':True,\'"'"'files\'"'"':hashes}\n write(label+\'"'"'-source.json\'"'"',result)\n return result\n\n# Darwin APIs retain argv boundaries, never process environments.\ndef native_identity(pid):\n lib = ctypes.CDLL(\'"'"'/usr/lib/libproc.dylib\'"'"', use_errno=True)\n path = ctypes.create_string_buffer(4096)\n exe = os.fsdecode(path.value) if lib.proc_pidpath(pid,path,len(path)) > 0 else None\n buf = ctypes.create_string_buffer(262144); size = ctypes.c_size_t(len(buf))\n mib = (ctypes.c_int*3)(1,49,pid)\n args = None\n if ctypes.CDLL(None,use_errno=True).sysctl(mib,3,buf,ctypes.byref(size),None,0) == 0:\n  data = buf.raw[:size.value]\n  argc = int.from_bytes(data[:4],sys.byteorder)\n  pos = data.find(b\'"'"'\\0\'"'"',4)+1\n  while pos < len(data) and data[pos] == 0: pos += 1\n  args=[]\n  for _ in range(min(argc,1024)):\n   end=data.find(b\'"'"'\\0\'"'"',pos)\n   if end < 0: args=None; break\n   args.append(os.fsdecode(data[pos:end])); pos=end+1\n  if argc > 1024: args=None\n vnode = ctypes.create_string_buffer(2352)\n n = lib.proc_pidinfo(pid,9,0,vnode,len(vnode))\n cwd = os.fsdecode(vnode.raw[152:1176].split(b\'"'"'\\0\'"'"',1)[0]) if n == len(vnode) else None\n return {\'"'"'executable\'"'"':exe,\'"'"'argv\'"'"':args,\'"'"'cwd\'"'"':cwd,\'"'"'cwd_api_bytes\'"'"':n}\n\ndef collector(row):\n return row.get(\'"'"'executable\'"'"') and pathlib.Path(row[\'"'"'executable\'"'"']).name == \'"'"'chrono-harness\'"'"' and \'"'"'--collect\'"'"' in (row.get(\'"'"'argv\'"'"') or [])\n\ndef watch(p, deadline):\n seen, ticks, samples_at, sample_pids = {}, 0, -30, set()\n with open(OUT/\'"'"'test.timeline.jsonl\'"'"',\'"'"'w\'"'"') as timeline:\n  while p.poll() is None:\n   now=time.monotonic()\n   if now >= deadline: raise subprocess.TimeoutExpired(p.args,900)\n   if ticks >= 900 or timeline.tell()>=16777216: p.wait(timeout=max(.001,deadline-now)); break\n   try:\n    raw=subprocess.run([\'"'"'/bin/ps\'"'"',\'"'"'-axo\'"'"',\'"'"'pid=,ppid=,pgid=,pcpu=,time=,rss=,state=\'"'"'],\n     env=ENV,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=min(2,deadline-now),check=True).stdout\n    table={}\n    for line in raw.decode().splitlines():\n     f=line.split()\n     if len(f)==7:\n      pid,ppid,pgid,cpu,cputime,rss,state=f\n      table[int(pid)]={\'"'"'pid\'"'"':int(pid),\'"'"'ppid\'"'"':int(ppid),\'"'"'pgid\'"'"':int(pgid),\'"'"'cpu_percent\'"'"':float(cpu),\'"'"'cpu_time\'"'"':cputime,\'"'"'rss_kib\'"'"':int(rss),\'"'"'state\'"'"':state}\n    ids={p.pid}; pending=True\n    while pending:\n     more={pid for pid,r in table.items() if r[\'"'"'ppid\'"'"'] in ids or r[\'"'"'pgid\'"'"']==p.pid}\n     pending=bool(more-ids); ids |= more\n    rows=[]\n    for pid in sorted(ids)[:128]:\n     if pid not in table: continue\n     if pid not in seen and len(seen)<512:\n      seen[pid]=native_identity(pid)\n      exe=seen[pid].get(\'"'"'executable\'"'"')\n      if exe and exe.startswith(str(ROOT/\'"'"'crates/judge-workflow-tests/target/\'"'"')) and pathlib.Path(exe).name.startswith(\'"'"'consumer-\'"'"'):\n       seen[pid][\'"'"'binary\'"'"']=tool(\'"'"'observed-consumer\'"'"',exe)\n     row=dict(table[pid],**seen.get(pid,{}))\n     if len(json.dumps(rows+[row]))<=65536: rows.append(row)\n    item={\'"'"'monotonic\'"'"':now,\'"'"'at_seconds\'"'"':now-START,\'"'"'test_seconds\'"'"':now-TEST_BEGIN,\n     \'"'"'system_processes\'"'"':len(table),\'"'"'system_runnable\'"'"':sum(\'"'"'R\'"'"' in r[\'"'"'state\'"'"'] for r in table.values()),\n     \'"'"'load_average\'"'"':os.getloadavg(),\'"'"'owned_count\'"'"':len(ids),\'"'"'rows_retained\'"'"':len(rows),\'"'"'rows\'"'"':rows}\n    timeline.write(json.dumps(item)+\'"'"'\\n\'"'"'); timeline.flush()\n    if len(SAMPLES)<3 and now-samples_at>=30 and deadline-now>12:\n     candidates=[r for r in rows if collector(r) and r[\'"'"'pid\'"'"'] not in sample_pids]\n     if candidates:\n      row=candidates[0]; actual=native_identity(row[\'"'"'pid\'"'"'])\n      if collector(actual):\n       binary=tool(\'"'"'sampled-collector\'"'"',actual[\'"'"'executable\'"'"'])\n       name=\'"'"'collector-sample-\'"'"'+str(len(SAMPLES))\n       argv=[\'"'"'/usr/bin/sample\'"'"',str(row[\'"'"'pid\'"'"']),\'"'"'2\'"'"',\'"'"'1\'"'"',\'"'"'-file\'"'"',\'"'"'/dev/stdout\'"'"']\n       r=command(name,argv,min(8,deadline-time.monotonic()),limit=2097152)\n       sample={\'"'"'target\'"'"':actual,\'"'"'binary\'"'"':binary,\n         \'"'"'pid\'"'"':row[\'"'"'pid\'"'"'],\'"'"'at_seconds\'"'"':now-START,\'"'"'command\'"'"':r}\n       sample[\'"'"'stack\'"'"']=r[\'"'"'stdout\'"'"']\n       SAMPLES.append(sample); sample_pids.add(row[\'"'"'pid\'"'"']); samples_at=now\n    ticks+=1\n   except (OSError,subprocess.CalledProcessError,subprocess.TimeoutExpired) as error:\n    timeline.write(json.dumps({\'"'"'monotonic\'"'"':time.monotonic(),\'"'"'observation_error\'"'"':type(error).__name__})+\'"'"'\\n\'"'"')\n   time.sleep(min(1,max(0,deadline-time.monotonic())))\n\ndef tool(label, path):\n p=pathlib.Path(path).resolve()\n return {\'"'"'name\'"'"':label,\'"'"'executable\'"'"':str(p),\'"'"'sha256\'"'"':sha(p),\'"'"'bytes\'"'"':p.stat().st_size}\n\ndef main():\n global ENV, GIT, TEST_BEGIN\n OUT.mkdir(parents=True,exist_ok=False)\n config=json.loads((ROOT/\'"'"'.chrono-harness/config.json\'"'"').read_text())\n policy=json.loads((ROOT/\'"'"'.chrono-harness/ci/check.json\'"'"').read_text())[\'"'"'policy\'"'"']\n registration=config[\'"'"'environment\'"'"']; credentials=set(registratio