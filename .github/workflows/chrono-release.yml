# chrono-ci: owned github-release/v1
name: "chrono-release-build"
on:
  push:
    branches: ["integration/distribution","integration/release-ci","integration/release-units"]
  workflow_dispatch:
    inputs:
      source:
        description: Source revision to check out
        required: true
        type: string
permissions:
  contents: read
jobs:
  linux_build_runner:
    if: ${{ github.event.deleted != true }}
    runs-on: "ubuntu-24.04"
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.release_upload.outputs.artifact-id }}
      run_id: ${{ steps.release_identity.outputs.run_id }}
      attempt: ${{ steps.release_identity.outputs.attempt }}
    steps:
      - name: Check out requested release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source || github.sha }}
          fetch-depth: 0
      - name: Bind original producing attempt
        id: release_identity
        if: ${{ always() }}
        shell: bash
        env:
          RELEASE_RUN: ${{ github.run_id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          printf 'run_id=%s\nattempt=%s\n' "$RELEASE_RUN" "$RELEASE_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Run registered release command
        if: ${{ always() }}
        shell: bash
        env:
          CHRONO_RELEASE_DEPENDENCIES: ${{ toJson(needs) }}
          CHRONO_RELEASE_RUN: ${{ github.run_id }}
          CHRONO_RELEASE_ATTEMPT: ${{ github.run_attempt }}
          CHRONO_RELEASE_JOB: "linux_build_runner"
        run: |
          'python3' '.chrono-harness/release/build.py' '.' '.chrono-harness/cache/release-results/build_runner' '--unit' 'build_runner'
      - name: Preserve original release artifacts
        id: release_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "chrono-release-linux-build_runner-${{ github.run_id }}-${{ github.run_attempt }}"
          path: ".chrono-harness/cache/release-results/build_runner/"
          if-no-files-found: error
          include-hidden-files: true
