# Host-bootstrap experiment: acquire the missing system Git identity for audit #224.
# This fixed branch revision is observation data, not a business check or admission.
name: "chrono / native Git observation"
on:
  push:
    branches: ["integration/audit-git-data-20261105"]
permissions:
  contents: read
jobs:
  acquire:
    name: "Observe system Git / macos-26"
    if: ${{ github.event.deleted != true }}
    runs-on: macos-26
    timeout-minutes: 3
    steps:
      - name: Check out exact observation method
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Observe original system Git bytes, version and OS
        shell: bash
        run: |
          /usr/bin/sw_vers
          /usr/bin/shasum -a 256 /usr/bin/git
          /usr/bin/git --version
          /usr/bin/shasum -a 256 /usr/bin/git
