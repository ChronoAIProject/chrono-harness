      - name: Bootstrap registered tools
        shell: bash
        run: |
          '/usr/bin/python3' '.chrono-harness/ci/bootstrap.py' '.' '.chrono-harness/ci/bootstrap-core.json'
      - name: Canonical harness check
        id: chrono_cache_work
        shell: bash
        env:
          CHRONO_CHECK_SOURCE: ci
          CHRONO_CI_DETECTION: ${{ needs.detect.outputs.detection }}
          CHRONO_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          '.chrono-harness/bin/chrono-harness' 'check' '--unit' 'cache'
      - name: Bind original unit artifact production
        id: production
        shell: bash
        run: |
          '.chrono-harness/bin/chrono-ci' production --host-root . --config '.chrono-harness/ci/units.json' --unit 'cache' --github-output "$GITHUB_OUTPUT"
      - name: Save registered cache check.cache
        id: chrono_cache_23a3feef020d3208f4a623dc56cf586a8aaae484401670e9eb8dbe9916b75dac_save
        if: ${{ always() && steps.chrono_cache_plan.outcome == 'success' && steps.chrono_cache_work.outcome == 'success' && steps.chrono_cache_23a3feef020d3208f4a623dc56cf586a8aaae484401670e9eb8dbe9916b75dac_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_636865636b2e6361636865_key }}
