# chrono-ci: owned github-job-gating/v1
name: "chrono / collection"
on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev","integration/**"]
permissions:
  contents: read
  actions: read
concurrency:
  group: "chrono-ci:.github/workflows/chrono-ci.yml:${{ github.event_name }}:${{ github.event.pull_request.number || github.run_id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  detect:
    name: Detect registered DELTA
    runs-on: "macos-26"
    timeout-minutes: 45
    outputs:
      detection: ${{ steps.detect.outputs.detection }}
      startup_binding: ${{ steps.chrono_startup.outputs.binding }}
      startup_artifact: ${{ steps.chrono_startup_upload.outputs.artifact-id }}
      unit_cache: ${{ steps.detect.outputs.unit_cache }}
      unit_ci: ${{ steps.detect.outputs.unit_ci }}
      unit_diagnostics: ${{ steps.detect.outputs.unit_diagnostics }}
      unit_distribution: ${{ steps.detect.outputs.unit_distribution }}
      unit_host-bootstrap: ${{ steps.detect.outputs.unit_host-bootstrap }}
      unit_inputs: ${{ steps.detect.outputs.unit_inputs }}
      unit_instructions: ${{ steps.detect.outputs.unit_instructions }}
      unit_judge-ci: ${{ steps.detect.outputs.unit_judge-ci }}
      unit_judge-cost: ${{ steps.detect.outputs.unit_judge-cost }}
      unit_judge-filemap: ${{ steps.detect.outputs.unit_judge-filemap }}
      unit_judge-mixed: ${{ steps.detect.outputs.unit_judge-mixed }}
      unit_judge-projects: ${{ steps.detect.outputs.unit_judge-projects }}
      unit_judge-registration: ${{ steps.detect.outputs.unit_judge-registration }}
      unit_judge-routes: ${{ steps.detect.outputs.unit_judge-routes }}
      unit_judge-workflow: ${{ steps.detect.outputs.unit_judge-workflow }}
      unit_judge-workflow-short: ${{ steps.detect.outputs.unit_judge-workflow-short }}
      unit_judge-workflow-units: ${{ steps.detect.outputs.unit_judge-workflow-units }}
      unit_release-build: ${{ steps.detect.outputs.unit_release-build }}
      unit_runner: ${{ steps.detect.outputs.unit_runner }}
      unit_worktree: ${{ steps.detect.outputs.unit_worktree }}
      unit_worktree-adoption: ${{ steps.detect.outputs.unit_worktree-adoption }}
    env:
      CARGO_HOME: "${{ github.workspace }}/.chrono-harness/cache/bootstrap-owner-tooling/cargo"
      RUSTUP_HOME: "${{ github.workspace }}/.chrono-harness/cache/bootstrap-owner-tooling/rustup"
    steps:
      - name: Acquire declared detector source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .chrono-harness/
            crates/
            assets/
            .github/workflows/chrono-ci.yml
            .gitignore
          persist-credentials: true
      - name: Restore download cache cargo.detect
        id: chrono_download_0
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: "chrono-download-v1-chrono-harness-cargo.detect-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.chrono-harness/ci/bootstrap-toolchains.json') }}-${{ hashFiles('.chrono-harness/ci/native/Cargo.lock', 'crates/cache/Cargo.lock', 'crates/ci/Cargo.lock', 'crates/judge-ci/Cargo.lock', 'crates/runner/Cargo.lock', 'crates/worktree/Cargo.lock') }}"
          path: |
            .chrono-harness/cache/bootstrap-owner-tooling/cargo/registry/cache/
            .chrono-harness/cache/bootstrap-owner-tooling/cargo/registry/index/
            .chrono-harness/cache/bootstrap-owner-tooling/cargo/registry/src/
            .chrono-harness/cache/bootstrap-owner-tooling/cargo/git/db/
            .chrono-harness/cache/bootstrap-owner-tooling/cargo/git/checkouts/
          restore-keys: |
            chrono-download-v1-chrono-harness-cargo.detect-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.chrono-harness/ci/bootstrap-toolchains.json') }}-
          fail-on-cache-miss: false
      - name: Restore download cache rustup
        id: chrono_download_1
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: "chrono-download-v1-chrono-harness-rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.chrono-harness/ci/bootstrap-toolchains.json') }}-${{ hashFiles('.chrono-harness/ci/bootstrap-toolchains.json') }}"
          path: |
            .chrono-harness/cache/bootstrap-owner-tooling/rustup/toolchains/
            .chrono-harness/cache/bootstrap-owner-tooling/rustup/update-hashes/
          restore-keys: |
            chrono-download-v1-chrono-harness-rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.chrono-harness/ci/bootstrap-toolchains.json') }}-
          fail-on-cache-miss: false
      - name: Prepare registered caches
        id: chrono_cache_plan
        shell: bash
        run: |
          '/bin/bash' '.chrono-harness/ci/bootstrap-native.sh' '.' '.chrono-harness/ci/bootstrap-cache.json'
          '.chrono-harness/bin/chrono-cache' plan --host-root . --config '.chrono-harness/cache.json' --consumer 'check.detect' --plan-output '.chrono-harness/state/cache/check.detect/plan.json' --github-output "$GITHUB_OUTPUT"
      - name: Restore registered cache detect.ci
        id: cache_0_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_0_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_0_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_0_restore }}
          fail-on-cache-miss: false
      - name: Restore registered cache detect.judge-ci
        id: cache_1_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_1_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_1_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_1_restore }}
          fail-on-cache-miss: false
      - name: Restore registered cache detect.runner
        id: cache_2_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_2_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_2_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_2_restore }}
          fail-on-cache-miss: false
      - name: Restore registered cache detect.worktree
        id: cache_3_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_3_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_3_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_3_restore }}
          fail-on-cache-miss: false
      - name: Restore registered cache verus.archive
        id: cache_4_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_4_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_4_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_4_restore }}
          fail-on-cache-miss: false
      - name: Recover failed cache restores
        if: ${{ steps.chrono_cache_plan.outputs.cache_recovery == 'discard-failed-host-restores' }}
        shell: bash
        env:
          CHRONO_CACHE_RESTORE_STEPS: ${{ toJSON(steps) }}
        run: |
          '.chrono-harness/bin/chrono-cache' recover --host-root . --config '.chrono-harness/cache.json' --plan '.chrono-harness/state/cache/check.detect/plan.json' --steps-env CHRONO_CACHE_RESTORE_STEPS
      - name: Bootstrap registered detector tools
        id: chrono_startup
        shell: bash
        run: |
          '/bin/bash' '.chrono-harness/ci/bootstrap-native.sh' '.' '.chrono-harness/ci/bootstrap-shared.json' 'produce'
      - name: Publish registered startup artifact
        id: chrono_startup_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrono-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ".chrono-harness/startup/"
          if-no-files-found: error
          include-hidden-files: true
      - name: Detect required units from fixed Git endpoints
        id: detect
        shell: bash
        env:
          CHRONO_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          '.chrono-harness/bin/chrono-ci' detect --host-root . --config '.chrono-harness/ci/units.json' --github-output "$GITHUB_OUTPUT"
      - name: Save download cache cargo.detect
        if: ${{ github.event_name == 'push' && always() && !cancelled() && steps.chrono_download_0.outcome == 'success' && steps.chrono_download_0.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: "chrono-download-v1-chrono-harness-cargo.detect-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.chrono-harness/ci/bootstrap-toolchains.json') }}-${{ hashFiles('.chrono-harness/ci/native/Cargo.lock', 'crates/cache/Cargo.lock', 'crates/ci/Cargo.lock', 'crates/judge-ci/Cargo.lock', 'crates/runner/Cargo.lock', 'crates/worktree/Cargo.lock') }}"
          path: |
            .chrono-harness/cache/bootstrap-owner-tooling/cargo/registry/cache/
            .chrono-harness/cache/bootstrap-owner-tooling/cargo/registry/index/
            .chrono-harness/cache/bootstrap-owner-tooling/cargo/registry/src/
            .chrono-harness/cache/bootstrap-owner-tooling/cargo/git/db/
            .chrono-harness/cache/bootstrap-owner-tooling/cargo/git/checkouts/
      - name: Save download cache rustup
        if: ${{ github.event_name == 'push' && always() && !cancelled() && steps.chrono_download_1.outcome == 'success' && steps.chrono_download_1.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: "chrono-download-v1-chrono-harness-rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.chrono-harness/ci/bootstrap-toolchains.json') }}-${{ hashFiles('.chrono-harness/ci/bootstrap-toolchains.json') }}"
          path: |
            .chrono-harness/cache/bootstrap-owner-tooling/rustup/toolchains/
            .chrono-harness/cache/bootstrap-owner-tooling/rustup/update-hashes/
      - name: Seal producer cache contents
        id: chrono_cache_seal
        if: ${{ github.event_name == 'push' && always() && !cancelled() && steps.chrono_cache_plan.outputs.cache_content_verification == 'producer-manifest/v1' }}
        shell: bash
        env:
          CHRONO_CACHE_PRODUCER_STEPS: ${{ toJSON(steps) }}
        run: |
          '.chrono-harness/bin/chrono-cache' seal --host-root . --config '.chrono-harness/cache.json' --plan '.chrono-harness/state/cache/check.detect/plan.json' --steps-env CHRONO_CACHE_PRODUCER_STEPS --work 'detect' --bootstrap chrono_startup --save-after-bootstrap '["detect.ci","detect.judge-ci","detect.runner","detect.worktree","verus.archive"]' --save-caches '["detect.ci","detect.judge-ci","detect.runner","detect.worktree","verus.archive"]' --github-output "$GITHUB_OUTPUT"
      - name: Save registered cache detect.ci
        id: cache_0_save
        if: ${{ github.event_name == 'push' && always() && !cancelled() && steps.chrono_cache_plan.outcome == 'success' && (steps.chrono_startup.outcome == 'success' || (steps.chrono_cache_plan.outputs.cache_0_save_on_failure == 'true' && steps.chrono_startup.outcome == 'failure')) && steps.cache_0_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_0_key && (steps.chrono_cache_plan.outputs.cache_0_verification != 'producer-manifest/v1' || steps.chrono_cache_seal.outputs.cache_0_sealed == 'true') }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_0_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_0_paths }}
      - name: Save registered cache detect.judge-ci
        id: cache_1_save
        if: ${{ github.event_name == 'push' && always() && !cancelled() && steps.chrono_cache_plan.outcome == 'success' && (steps.chrono_startup.outcome == 'success' || (steps.chrono_cache_plan.outputs.cache_1_save_on_failure == 'true' && steps.chrono_startup.outcome == 'failure')) && steps.cache_1_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_1_key && (steps.chrono_cache_plan.outputs.cache_1_verification != 'producer-manifest/v1' || steps.chrono_cache_seal.outputs.cache_1_sealed == 'true') }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_1_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_1_paths }}
      - name: Save registered cache detect.runner
        id: cache_2_save
        if: ${{ github.event_name == 'push' && always() && !cancelled() && steps.chrono_cache_plan.outcome == 'success' && (steps.chrono_startup.outcome == 'success' || (steps.chrono_cache_plan.outputs.cache_2_save_on_failure == 'true' && steps.chrono_startup.outcome == 'failure')) && steps.cache_2_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_2_key && (steps.chrono_cache_plan.outputs.cache_2_verification != 'producer-manifest/v1' || steps.chrono_cache_seal.outputs.cache_2_sealed == 'true') }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_2_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_2_paths }}
      - name: Save registered cache detect.worktree
        id: cache_3_save
        if: ${{ github.event_name == 'push' && always() && !cancelled() && steps.chrono_cache_plan.outcome == 'success' && (steps.chrono_startup.outcome == 'success' || (steps.chrono_cache_plan.outputs.cache_3_save_on_failure == 'true' && steps.chrono_startup.outcome == 'failure')) && steps.cache_3_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_3_key && (steps.chrono_cache_plan.outputs.cache_3_verification != 'producer-manifest/v1' || steps.chrono_cache_seal.outputs.cache_3_sealed == 'true') }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_3_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_3_paths }}
      - name: Save registered cache verus.archive
        id: cache_4_save
        if: ${{ github.event_name == 'push' && always() && !cancelled() && steps.chrono_cache_plan.outcome == 'success' && (steps.chrono_startup.outcome == 'success' || (steps.chrono_cache_plan.outputs.cache_4_save_on_failure == 'true' && steps.chrono_startup.outcome == 'failure')) && steps.cache_4_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_4_key && (steps.chrono_cache_plan.outputs.cache_4_verification != 'producer-manifest/v1' || steps.chrono_cache_seal.outputs.cache_4_sealed == 'true') }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_4_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_4_paths }}
      - name: Preserve detector evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrono-detector-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ".chrono-harness/state/"
          if-no-files-found: error
          include-hidden-files: true
  unit_cache:
    outputs:
      production: ${{ steps.production.outputs.production }}
    name: "chrono / cache"
    needs: detect
    if: ${{ needs.detect.outputs.unit_cache == 'true' }}
    runs-on: "macos-26"
    timeout-minutes: 45
    env:
      CARGO_HOME: "${{ github.workspace }}/.chrono-harness/cache/bootstrap-owner-tooling/cargo"
      RUSTUP_HOME: "${{ github.workspace }}/.chrono-harness/cache/bootstrap-owner-tooling/rustup"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: true
      - name: Restore download cache cargo.cache
        id: chrono_download_0
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: "chrono-download-v1-chrono-harness-cargo.cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.chrono-harness/ci/bootstrap-toolchains.json') }}-${{ hashFiles('.chrono-harness/ci/native/Cargo.lock', 'crates/cache-tests/Cargo.lock', 'crates/cache/Cargo.lock') }}"
          path: |
            .chrono-harness/cache/bootstrap-owner-tooling/cargo/registry/cache/
            .chrono-harness/cache/bootstrap-owner-tooling/cargo/registry/index/
            .chrono-harness/cache/bootstrap-owner-tooling/cargo/registry/src/
            .chrono-harness/cache/bootstrap-owner-tooling/cargo/git/db/
            .chrono-harness/cache/bootstrap-owner-tooling/cargo/git/checkouts/
          restore-keys: |
            chrono-download-v1-chrono-harness-cargo.cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.chrono-harness/ci/bootstrap-toolchains.json') }}-
            chrono-download-v1-chrono-harness-cargo.detect-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.chrono-harness/ci/bootstrap-toolchains.json') }}-
          fail-on-cache-miss: false
      - name: Restore download cache rustup
        id: chrono_download_1
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: "chrono-download-v1-chrono-harness-rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.chrono-harness/ci/bootstrap-toolchains.json') }}-${{ hashFiles('.chrono-harness/ci/bootstrap-toolchains.json') }}"
          path: |
            .chrono-harness/cache/bootstrap-owner-tooling/rustup/toolchains/
            .chrono-harness/cache/bootstrap-owner-tooling/rustup/update-hashes/
          restore-keys: |
            chrono-download-v1-chrono-harness-rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.chrono-harness/ci/bootstrap-toolchains.json') }}-
          fail-on-cache-miss: false
      - name: Download registered startup artifact
        if: ${{ needs.detect.result == 'success' && needs.detect.outputs.startup_artifact != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.detect.outputs.startup_artifact }}
          path: ".chrono-harness/startup/"
          merge-multiple: true
      - name: Install registered startup tools
        shell: bash
        env:
          CHRONO_STARTUP_BINDING: ${{ needs.detect.outputs.startup_binding }}
        run: |
          '/bin/bash' '.chrono-harness/ci/bootstrap-native.sh' '.' '.chrono-harness/ci/bootstrap-shared.json' 'install' 'unit_cache'
      - name: Prepare registered caches
        id: chrono_cache_plan
        shell: bash
        run: |
          '/bin/bash' '.chrono-harness/ci/bootstrap-native.sh' '.' '.chrono-harness/ci/bootstrap-shared.json' 'verify' 'cache'
          '.chrono-harness/bin/chrono-cache' plan --host-root . --config '.chrono-harness/cache.json' --consumer 'check.unit_cache' --plan-output '.chrono-harness/state/cache/check.unit_cache/plan.json' --github-output "$GITHUB_OUTPUT"
      - name: Restore registered cache check.cache-tests
        id: cache_0_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_0_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_0_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_0_restore }}
          fail-on-cache-miss: false
      - name: Recover failed cache restores
        if: ${{ steps.chrono_cache_plan.outputs.cache_recovery == 'discard-failed-host-restores' }}
        shell: bash
        env:
          CHRONO_CACHE_RESTORE_STEPS: ${{ toJSON(steps) }}
        run: |
          '.chrono-harness/bin/chrono-cache' recover --host-root . --config '.chrono-harness/cache.json' --plan '.chrono-harness/state/cache/check.unit_cache/plan.json' --steps-env CHRONO_CACHE_RESTORE_STEPS
      - name: Bootstrap registered tools
        shell: bash
        run: |
          '/bin/bash' '.chrono-harness/ci/bootstrap-native.sh' '.' '.chrono-harness/ci/bootstrap-unit.json'
      - name: Canonical harness check
        id: chrono_cache_work
        shell: bash
        env:
          CHRONO_CHECK_SOURCE: ci
          CHRONO_CI_DETECTION: ${{ needs.detect.outputs.detection }}
          CHRONO_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          '.chrono-harness/bin/chrono-harness' 'check' '--unit' 'cache'
      - name: Bind original unit artifact production
        id: production
        shell: bash
        run: |
          '.chrono-harness/bin/chrono-ci' production --host-root . --config '.chrono-harness/ci/units.json' --unit 'cache' --github-output "$GITHUB_OUTPUT"
      - name: Seal producer cache contents
        id: chrono_cache_seal
        if: ${{ github.event_name == 'push' && always() && !cancelled() && steps.chrono_cache_plan.outputs.cache_content_verification == 'producer-manifest/v1' }}
        shell: bash
        env:
          CHRONO_CACHE_PRODUCER_STEPS: ${{ toJSON(steps) }}
        run: |
          '.chrono-harness/bin/chrono-cache' seal --host-root . --config '.chrono-harness/cache.json' --plan '.chrono-harness/state/cache/check.unit_cache/plan.json' --steps-env CHRONO_CACHE_PRODUCER_STEPS --work 'chrono_cache_work' --save-caches '["check.cache-tests"]' --github-output "$GITHUB_OUTPUT"
      - name: Save registered cache check.cache-tests
        id: cache_0_save
        if: ${{ github.event_name == 'push' && always() && !cancelled() && steps.chrono_cache_plan.outcome == 'success' && (steps.chrono_cache_work.outcome == 'success' || (steps.chrono_cache_plan.outputs.cache_0_save_on_failure == 'true' && steps.chrono_cache_work.outcome == 'failure')) && steps.cache_0_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_0_key && (steps.chrono_cache_plan.outputs.cache_0_verification != 'producer-manifest/v1' || steps.chrono_cache_seal.outputs.cache_0_sealed == 'true') }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_0_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_0_paths }}
      - name: Preserve actual check evidence
        id: chrono_evidence_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrono-unit-cache-${{ github.run_id }}-${{ github.run_attempt }}
          path: ".chrono-harness/state/units/cache/"
          if-no-files-found: error
          include-hidden-files: true
      - name: Preserve failed job diagnostics
