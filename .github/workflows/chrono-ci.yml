        if: ${{ always() && !cancelled() && steps.chrono_cache_plan.outcome == 'success' && steps.chrono_cache_bootstrap.outcome == 'success' && steps.cache_2_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_2_key }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_2_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_2_paths }}
      - name: Save registered cache check.worktree
        id: cache_3_save
        if: ${{ always() && !cancelled() && steps.chrono_cache_plan.outcome == 'success' && steps.chrono_cache_bootstrap.outcome == 'success' && steps.cache_3_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_3_key }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_3_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_3_paths }}
      - name: Record original cache transport observations
        if: ${{ always() && steps.chrono_cache_plan.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          CHRONO_CACHE_STEPS: ${{ toJSON(steps) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          '.chrono-harness/bin/chrono-cache' report --host-root . --plan '.chrono-harness/state/cache/check.aggregate/plan.json' --report-directory '.chrono-harness/state/cache/check.aggregate/' --steps-env CHRONO_CACHE_STEPS --work 'chrono_cache_work' --bootstrap chrono_cache_bootstrap --save-caches '["check.ci","check.judge-ci","check.runner","check.worktree"]'
      - name: Preserve actual check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrono-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ".chrono-harness/state/"
          if-no-files-found: error
          include-hidden-files: true
