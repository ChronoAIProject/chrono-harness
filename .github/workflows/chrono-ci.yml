        if: ${{ always() && steps.chrono_cache_plan.outcome == 'success' && steps.chrono_cache_work.outcome == 'success' && steps.cache_636865636b2e72756e6e6572_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_636865636b2e72756e6e6572_key }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e72756e6e6572_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e72756e6e6572_paths }}
      - name: Save registered cache check.worktree
        id: cache_636865636b2e776f726b74726565_save
        if: ${{ always() && steps.chrono_cache_plan.outcome == 'success' && steps.chrono_cache_work.outcome == 'success' && steps.cache_636865636b2e776f726b74726565_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_636865636b2e776f726b74726565_key }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e776f726b74726565_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e776f726b74726565_paths }}
      - name: Preserve actual check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrono-unit-cache-${{ github.run_id }}-${{ github.run_attempt }}
          path: ".chrono-harness/state/"
          if-no-files-found: error
          include-hidden-files: true
  unit_ci:
    outputs:
      production: ${{ steps.production.outputs.production }}
    name: "chrono / ci"
    needs: detect
    if: ${{ needs.detect.outputs.unit_ci == 'true' }}
    runs-on: "macos-26"
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
