          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_3_restore }}
          fail-on-cache-miss: false
      - name: Restore registered cache check.runner
        id: cache_4_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_4_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_4_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_4_restore }}
          fail-on-cache-miss: false
      - name: Restore registered cache check.worktree
        id: cache_5_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_5_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_5_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_5_restore }}
          fail-on-cache-miss: false
      - name: Bootstrap registered tools
        shell: bash
        run: |
          '/usr/bin/python3' '.chrono-harness/ci/bootstrap.py' '.' '.chrono-harness/ci/bootstrap-core.json'
      - name: Canonical harness check
        id: chrono_cache_work
        shell: bash
        env:
          CHRONO_CHECK_SOURCE: ci
          CHRONO_CI_DETECTION: ${{ needs.detect.outputs.detection }}
          CHRONO_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          '.chrono-harness/bin/chrono-harness' 'check' '--unit' 'cache'
      - name: Bind original unit artifact production
        id: production
        shell: bash
        run: |
          '.chrono-harness/bin/chrono-ci' production --host-root . --config '.chrono-harness/ci/units.json' --unit 'cache' --github-output "$GITHUB_OUTPUT"
      - name: Save registered cache check.cache
        id: cache_0_save
        if: ${{ always() && !cancelled() && steps.chrono_cache_plan.outcome == 'success' && steps.chrono_cache_work.outcome == 'success' && steps.cache_0_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_0_key }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_0_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_0_paths }}
      - name: Save registered cache check.cache-tests
        id: cache_1_save
        if: ${{ always() && !cancelled() && steps.chrono_cache_plan.outcome == 'success' && steps.chrono_cache_work.outcome == 'success' && steps.cache_1_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_1_key }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_1_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_1_paths }}
      - name: Record original cache transport observations
        if: ${{ always() && steps.chrono_cache_plan.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          CHRONO_CACHE_STEPS: ${{ toJSON(steps) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          '.chrono-harness/bin/chrono-cache' report --host-root . --plan '.chrono-harness/state/cache/check.unit_cache/plan.json' --report-directory '.chrono-harness/state/cache/check.unit_cache/' --steps-env CHRONO_CACHE_STEPS --work 'chrono_cache_work' --save-caches '["check.cache","check.cache-tests"]'
      - name: Preserve actual check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrono-unit-cache-${{ github.run_id }}-${{ github.run_attempt }}
          path: ".chrono-harness/state/"
          if-no-files-found: error
          include-hidden-files: true
