          path: ${{ steps.chrono_cache_plan.outputs.cache_2_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_2_restore }}
          fail-on-cache-miss: false
      - name: Restore registered cache check.judge-ci
        id: cache_3_restore
