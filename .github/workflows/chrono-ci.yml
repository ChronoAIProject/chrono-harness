# chrono-ci: owned github-job-gating/v1
name: "chrono / collection"
on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
permissions:
  contents: read
  actions: read
concurrency:
  group: "chrono-ci:.github/workflows/chrono-ci.yml:${{ github.event_name }}:${{ github.event.pull_request.number || github.run_id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  detect:
    name: Detect registered DELTA
    runs-on: "macos-26"
    timeout-minutes: 45
    outputs:
      detection: ${{ steps.detect.outputs.detection }}
      unit_cache: ${{ steps.detect.outputs.unit_cache }}
      unit_ci: ${{ steps.detect.outputs.unit_ci }}
      unit_diagnostics: ${{ steps.detect.outputs.unit_diagnostics }}
      unit_distribution: ${{ steps.detect.outputs.unit_distribution }}
      unit_host-bootstrap: ${{ steps.detect.outputs.unit_host-bootstrap }}
      unit_inputs: ${{ steps.detect.outputs.unit_inputs }}
      unit_instructions: ${{ steps.detect.outputs.unit_instructions }}
      unit_judge-cargo: ${{ steps.detect.outputs.unit_judge-cargo }}
      unit_judge-ci: ${{ steps.detect.outputs.unit_judge-ci }}
      unit_judge-cost: ${{ steps.detect.outputs.unit_judge-cost }}
      unit_judge-filemap: ${{ steps.detect.outputs.unit_judge-filemap }}
      unit_judge-mixed: ${{ steps.detect.outputs.unit_judge-mixed }}
      unit_judge-projects: ${{ steps.detect.outputs.unit_judge-projects }}
      unit_judge-projects-migration: ${{ steps.detect.outputs.unit_judge-projects-migration }}
      unit_judge-registration: ${{ steps.detect.outputs.unit_judge-registration }}
      unit_judge-routes: ${{ steps.detect.outputs.unit_judge-routes }}
      unit_judge-workflow: ${{ steps.detect.outputs.unit_judge-workflow }}
      unit_judge-workflow-short: ${{ steps.detect.outputs.unit_judge-workflow-short }}
      unit_judge-workflow-units: ${{ steps.detect.outputs.unit_judge-workflow-units }}
      unit_release-build: ${{ steps.detect.outputs.unit_release-build }}
      unit_release-build-integration: ${{ steps.detect.outputs.unit_release-build-integration }}
      unit_runner: ${{ steps.detect.outputs.unit_runner }}
      unit_scoped-v1: ${{ steps.detect.outputs.unit_scoped-v1 }}
      unit_workflow-inventory: ${{ steps.detect.outputs.unit_workflow-inventory }}
      unit_worktree: ${{ steps.detect.outputs.unit_worktree }}
      unit_worktree-adoption: ${{ steps.detect.outputs.unit_worktree-adoption }}
    steps:
      - name: Acquire declared detector source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .chrono-harness/
            crates/
            assets/
            .github/workflows/chrono-ci.yml
            .gitignore
          persist-credentials: true
      - name: Prepare registered caches
        id: chrono_cache_plan
        shell: bash
        run: |
          '/usr/bin/python3' '.chrono-harness/ci/bootstrap.py' '.' '.chrono-harness/ci/bootstrap-cache.json'
          '.chrono-harness/bin/chrono-cache' plan --host-root . --config '.chrono-harness/cache.json' --consumer 'check.detect' --plan-output '.chrono-harness/state/cache/check.detect/plan.json' --github-output "$GITHUB_OUTPUT"
      - name: Restore registered cache detect.ci
        id: cache_0_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_0_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_0_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_0_restore }}
          fail-on-cache-miss: false
      - name: Bootstrap registered detector tools
        id: chrono_cache_bootstrap
        shell: bash
        run: |
          '/usr/bin/python3' '.chrono-harness/ci/bootstrap.py' '.' '.chrono-harness/ci/bootstrap-detector.json'
      - name: Detect required units from fixed Git endpoints
        id: detect
        shell: bash
        env:
          CHRONO_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          '.chrono-harness/bin/chrono-ci' detect --host-root . --config '.chrono-harness/ci/units.json' --github-output "$GITHUB_OUTPUT"
      - name: Save registered cache detect.ci
        id: cache_0_save
        if: ${{ always() && !cancelled() && steps.chrono_cache_plan.outcome == 'success' && steps.chrono_cache_bootstrap.outcome == 'success' && steps.cache_0_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_0_key }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_0_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_0_paths }}
      - name: Record original cache transport observations
        if: ${{ always() && steps.chrono_cache_plan.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          CHRONO_CACHE_STEPS: ${{ toJSON(steps) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          '.chrono-harness/bin/chrono-cache' report --host-root . --plan '.chrono-harness/state/cache/check.detect/plan.json' --report-directory '.chrono-harness/state/cache/check.detect/' --steps-env CHRONO_CACHE_STEPS --work 'detect' --bootstrap chrono_cache_bootstrap --save-caches '["detect.ci"]'
      - name: Preserve detector evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrono-detector-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ".chrono-harness/state/"
          if-no-files-found: error
          include-hidden-files: true
  unit_cache:
    outputs:
      production: ${{ steps.production.outputs.production }}
    name: "chrono / cache"
    needs: detect
    if: ${{ needs.detect.outputs.unit_cache == 'true' }}
    runs-on: "macos-26"
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: true
      - name: Prepare registered caches
        id: chrono_cache_plan
        shell: bash
        run: |
          '/usr/bin/python3' '.chrono-harness/ci/bootstrap.py' '.' '.chrono-harness/ci/bootstrap-cache.json'
          '.chrono-harness/bin/chrono-cache' plan --host-root . --config '.chrono-harness/cache.json' --consumer 'check.unit_cache' --plan-output '.chrono-harness/state/cache/check.unit_cache/plan.json' --github-output "$GITHUB_OUTPUT"
      - name: Restore registered cache check.cache
        id: cache_0_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_0_key }}
