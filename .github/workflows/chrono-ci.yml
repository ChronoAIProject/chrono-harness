          path: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e63616368652d7465737473_paths }}
      - name: Save registered cache check.ci
        id: cache_636865636b2e6369_save
        if: ${{ always() && steps.chrono_cache_plan.outcome == 'success' && steps.chrono_cache_work.outcome == 'success' && steps.cache_636865636b2e6369_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_636865636b2e6369_key }}
