          CHRONO_CI_DETECTION: ${{ needs.detect.outputs.detection }}
          CHRONO_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          '.chrono-harness/bin/chrono-harness' 'check' '--unit' 'worktree'
      - name: Preserve actual check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrono-unit-worktree-${{ github.run_id }}-${{ github.run_attempt }}
          path: ".chrono-harness/state/"
          if-no-files-found: error
  aggregate:
    name: "chrono / collection"
    needs: ["detect","unit_ci","unit_distribution","unit_inputs","unit_instructions","unit_judge-cargo","unit_judge-ci","unit_judge-cost","unit_judge-filemap","unit_judge-mixed","unit_judge-projects","unit_judge-registration","unit_judge-routes","unit_judge-workflow","unit_runner","unit_scoped-v1","unit_worktree"]
    if: ${{ always() }}
    runs-on: "macos-26"
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate || github.event.after || github.sha }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: true
      - name: Bootstrap registered tools
        shell: bash
        run: |
          '/usr/bin/python3' '.chrono-harness/ci/bootstrap.py' '.' '.chrono-harness/ci/bootstrap-core.json'
      - name: Canonical harness check
        shell: bash
        env:
          CHRONO_CHECK_SOURCE: ci
          CHRONO_CI_DETECTION: ${{ needs.detect.outputs.detection }}
          CHRONO_CI_NEEDS: ${{ toJSON(needs) }}
          CHRONO_WORKFLOW_REVISION: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          '.chrono-harness/bin/chrono-harness' 'check' '--collect'
      - name: Preserve actual check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrono-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ".chrono-harness/state/"
          if-no-files-found: error
