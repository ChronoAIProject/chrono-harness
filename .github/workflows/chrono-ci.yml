        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e72756e6e6572_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e72756e6e6572_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e72756e6e6572_restore }}
          fail-on-cache-miss: false
      - name: Restore registered cache check.worktree
        id: cache_636865636b2e776f726b74726565_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e776f726b74726565_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e776f726b74726565_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e776f726b74726565_restore }}
          fail-on-cache-miss: false
      - name: Bootstrap registered tools
        shell: bash
        run: |
          '/usr/bin/python3' '.chrono-harness/ci/bootstrap.py' '.' '.chrono-harness/ci/bootstrap-core.json'
      - name: Canonical harness check
        id: chrono_cache_work
        shell: bash
        env:
          CHRONO_CHECK_SOURCE: ci
          CHRONO_CI_DETECTION: ${{ needs.detect.outputs.detection }}
          CHRONO_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          '.chrono-harness/bin/chrono-harness' 'check' '--unit' 'cache'
      - name: Bind original unit artifact production
        id: production
        shell: bash
        run: |
          '.chrono-harness/bin/chrono-ci' production --host-root . --config '.chrono-harness/ci/units.json' --unit 'cache' --github-output "$GITHUB_OUTPUT"
      - name: Save registered cache check.cache
        id: cache_636865636b2e6361636865_save
        if: ${{ always() && steps.chrono_cache_plan.outcome == 'success' && steps.chrono_cache_work.outcome == 'success' && steps.cache_636865636b2e6361636865_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_636865636b2e6361636865_key }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e6361636865_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e6361636865_paths }}
      - name: Save registered cache check.cache-tests
        id: cache_636865636b2e63616368652d7465737473_save
        if: ${{ always() && steps.chrono_cache_plan.outcome == 'success' && steps.chrono_cache_work.outcome == 'success' && steps.cache_636865636b2e63616368652d7465737473_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_636865636b2e63616368652d7465737473_key }}
