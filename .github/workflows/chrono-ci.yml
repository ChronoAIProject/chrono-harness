# chrono-ci: owned github-job-gating/v1
name: "chrono / collection"
on:
  push:
    branches: ["dev","integration/**"]
  pull_request:
    branches: ["dev"]
permissions:
  contents: read
  actions: read
jobs:
  detect:
    name: Detect registered DELTA
    runs-on: "macos-26"
    timeout-minutes: 45
    outputs:
      detection: ${{ steps.detect.outputs.detection }}
      unit_cache: ${{ steps.detect.outputs.unit_cache }}
      unit_ci: ${{ steps.detect.outputs.unit_ci }}
      unit_diagnostics: ${{ steps.detect.outputs.unit_diagnostics }}
      unit_distribution: ${{ steps.detect.outputs.unit_distribution }}
      unit_host-bootstrap: ${{ steps.detect.outputs.unit_host-bootstrap }}
      unit_inputs: ${{ steps.detect.outputs.unit_inputs }}
      unit_instructions: ${{ steps.detect.outputs.unit_instructions }}
      unit_judge-cargo: ${{ steps.detect.outputs.unit_judge-cargo }}
      unit_judge-ci: ${{ steps.detect.outputs.unit_judge-ci }}
      unit_judge-cost: ${{ steps.detect.outputs.unit_judge-cost }}
      unit_judge-filemap: ${{ steps.detect.outputs.unit_judge-filemap }}
      unit_judge-mixed: ${{ steps.detect.outputs.unit_judge-mixed }}
      unit_judge-projects: ${{ steps.detect.outputs.unit_judge-projects }}
      unit_judge-registration: ${{ steps.detect.outputs.unit_judge-registration }}
      unit_judge-routes: ${{ steps.detect.outputs.unit_judge-routes }}
      unit_judge-workflow: ${{ steps.detect.outputs.unit_judge-workflow }}
      unit_judge-workflow-short: ${{ steps.detect.outputs.unit_judge-workflow-short }}
      unit_judge-workflow-units: ${{ steps.detect.outputs.unit_judge-workflow-units }}
      unit_release-build: ${{ steps.detect.outputs.unit_release-build }}
      unit_release-build-integration: ${{ steps.detect.outputs.unit_release-build-integration }}
      unit_runner: ${{ steps.detect.outputs.unit_runner }}
      unit_scoped-v1: ${{ steps.detect.outputs.unit_scoped-v1 }}
      unit_workflow-inventory: ${{ steps.detect.outputs.unit_workflow-inventory }}
      unit_worktree: ${{ steps.detect.outputs.unit_worktree }}
      unit_worktree-adoption: ${{ steps.detect.outputs.unit_worktree-adoption }}
    steps:
      - name: Acquire declared detector source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .chrono-harness/
            crates/
            assets/
            .github/workflows/chrono-ci.yml
            .gitignore
          persist-credentials: true
      - name: Prepare registered caches
        id: chrono_cache_plan
        shell: bash
        run: |
          '/usr/bin/python3' '.chrono-harness/ci/bootstrap.py' '.' '.chrono-harness/ci/bootstrap-cache.json'
          '.chrono-harness/bin/chrono-cache' plan --host-root . --config '.chrono-harness/cache.json' --consumer 'check.detect' --github-output "$GITHUB_OUTPUT"
      - name: Restore registered cache check.ci
        id: chrono_cache_f1bb9c77d9f39ce334c258fa354e1ff72ac474cc229b9d76ece72704890fe3dd_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e6369_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e6369_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e6369_restore }}
          fail-on-cache-miss: false
      - name: Restore registered cache check.judge-ci
        id: chrono_cache_7f2fc632f5b29d95408879591456d993c3bdaf90e92b8e9a28109b268c9c4e6b_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e6a756467652d6369_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e6a756467652d6369_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e6a756467652d6369_restore }}
          fail-on-cache-miss: false
      - name: Restore registered cache check.runner
        id: chrono_cache_8fb33225ee981bc1867f7e0afe8f69b6dcbd1d1614bafadc3fffd0dc5750022f_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e72756e6e6572_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e72756e6e6572_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e72756e6e6572_restore }}
          fail-on-cache-miss: false
      - name: Restore registered cache check.worktree
        id: chrono_cache_a43aa7835fb7891ff69e70b3d69037c531fd182519985397971d4e30b2d3cc34_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e776f726b74726565_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e776f726b74726565_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e776f726b74726565_restore }}
          fail-on-cache-miss: false
      - name: Bootstrap registered detector tools
        shell: bash
        run: |
          '/usr/bin/python3' '.chrono-harness/ci/bootstrap.py' '.' '.chrono-harness/ci/bootstrap-core.json'
      - name: Detect required units from fixed Git endpoints
        id: detect
        shell: bash
        env:
          CHRONO_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          '.chrono-harness/bin/chrono-ci' detect --host-root . --config '.chrono-harness/ci/units.json' --github-output "$GITHUB_OUTPUT"
      - name: Save registered cache check.ci
        id: chrono_cache_f1bb9c77d9f39ce334c258fa354e1ff72ac474cc229b9d76ece72704890fe3dd_save
        if: ${{ always() && steps.chrono_cache_plan.outcome == 'success' && steps.detect.outcome == 'success' && steps.chrono_cache_f1bb9c77d9f39ce334c258fa354e1ff72ac474cc229b9d76ece72704890fe3dd_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_636865636b2e6369_key }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e6369_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e6369_paths }}
      - name: Save registered cache check.judge-ci
        id: chrono_cache_7f2fc632f5b29d95408879591456d993c3bdaf90e92b8e9a28109b268c9c4e6b_save
        if: ${{ always() && steps.chrono_cache_plan.outcome == 'success' && steps.detect.outcome == 'success' && steps.chrono_cache_7f2fc632f5b29d95408879591456d993c3bdaf90e92b8e9a28109b268c9c4e6b_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_636865636b2e6a756467652d6369_key }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e6a756467652d6369_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e6a756467652d6369_paths }}
      - name: Save registered cache check.runner
        id: chrono_cache_8fb33225ee981bc1867f7e0afe8f69b6dcbd1d1614bafadc3fffd0dc5750022f_save
        if: ${{ always() && steps.chrono_cache_plan.outcome == 'success' && steps.detect.outcome == 'success' && steps.chrono_cache_8fb33225ee981bc1867f7e0afe8f69b6dcbd1d1614bafadc3fffd0dc5750022f_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_636865636b2e72756e6e6572_key }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e72756e6e6572_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e72756e6e6572_paths }}
      - name: Save registered cache check.worktree
        id: chrono_cache_a43aa7835fb7891ff69e70b3d69037c531fd182519985397971d4e30b2d3cc34_save
        if: ${{ always() && steps.chrono_cache_plan.outcome == 'success' && steps.detect.outcome == 'success' && steps.chrono_cache_a43aa7835fb7891ff69e70b3d69037c531fd182519985397971d4e30b2d3cc34_restore.outputs.cache-matched-key != steps.chrono_cache_plan.outputs.cache_636865636b2e776f726b74726565_key }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e776f726b74726565_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e776f726b74726565_paths }}
  unit_cache:
    outputs:
      production: ${{ steps.production.outputs.production }}
    name: "chrono / cache"
    needs: detect
    if: ${{ needs.detect.outputs.unit_cache == 'true' }}
    runs-on: "macos-26"
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
