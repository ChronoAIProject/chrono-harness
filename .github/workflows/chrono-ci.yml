        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e63616368652d7465737473_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e63616368652d7465737473_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e63616368652d7465737473_restore }}
          fail-on-cache-miss: false
      - name: Restore registered cache check.ci
        id: cache_636865636b2e6369_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e6369_key }}
          path: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e6369_paths }}
          restore-keys: ${{ steps.chrono_cache_plan.outputs.cache_636865636b2e6369_restore }}
          fail-on-cache-miss: false
      - name: Restore registered cache check.judge-ci
        id: cache_636865636b2e6a756467652d6369_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
