# chrono-ci: owned github-units/v1
name: "chrono / worktree"
on:
  push:
    branches: ["dev","integration/**"]
  pull_request:
    branches: ["dev"]
  workflow_dispatch:
    inputs:
      base:
        description: Full base commit OID (omit only with initial)
        required: false
        type: string
      candidate:
        description: Full candidate commit OID
        required: true
        type: string
      initial:
        description: Explicit parentless initial inventory
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  check:
    name: "chrono / worktree"
    if: ${{ github.event.deleted != true }}
    runs-on: "macos-14"
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate || github.event.after || github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Bootstrap registered tools
        shell: bash
        run: |
          '/usr/bin/python3' '.chrono-harness/ci/bootstrap.py' '.' '.chrono-harness/ci/bootstrap-core.json'
      - name: Prepare fixed event inputs
        id: inputs
        shell: bash
        env:
          CHRONO_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          '.chrono-harness/bin/chrono-ci' prepare --host-root . --config '.chrono-harness/ci/units.json' --event "$GITHUB_EVENT_NAME" --payload "$GITHUB_EVENT_PATH" --workflow-revision "$CHRONO_WORKFLOW_REVISION" --github-output "$GITHUB_OUTPUT" --unit 'worktree'
      - name: Canonical harness check
        shell: bash
        env:
          CHRONO_BASE: ${{ steps.inputs.outputs.base }}
          CHRONO_CANDIDATE: ${{ steps.inputs.outputs.candidate }}
          CHRONO_INITIAL: ${{ steps.inputs.outputs.initial }}
        run: |
          if [ "$CHRONO_INITIAL" = true ]; then
            '.chrono-harness/bin/chrono-harness' 'check' '--config' '.chrono-harness/ci/check.json' '--candidate' "$CHRONO_CANDIDATE" '--initial' '--unit' 'worktree'
          else
            '.chrono-harness/bin/chrono-harness' 'check' '--config' '.chrono-harness/ci/check.json' '--base' "$CHRONO_BASE" '--candidate' "$CHRONO_CANDIDATE" '--unit' 'worktree'
          fi
      - name: Preserve actual check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chrono-unit-worktree-${{ github.run_id }}-${{ github.run_attempt }}
          path: ".chrono-harness/state/"
          if-no-files-found: error
