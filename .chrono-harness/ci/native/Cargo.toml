[package]
name = "chrono-host-bootstrap"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-host-bootstrap"
path = "src/main.rs"
test = false
bench = false

[dependencies]
chrono-harness = { path = "../../../crates/runner" }
chrono-judge-registration = { path = "../../../crates/judge-registration" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.dev.package.sha2]
opt-level = 3
