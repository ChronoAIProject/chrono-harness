[package]
name = "chrono-host-bootstrap-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono-harness = { path = "../../../crates/runner" }
chrono-host-bootstrap = { path = "../native" }
serde_json = "1"
tempfile = "3"

[[test]]
name = "bindings"
path = "tests/bindings.rs"

[[test]]
name = "environment"
path = "tests/environment.rs"

[[bin]]
name = "chrono-test-bootstrap-tool"
path = "tests/support/tool.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-bootstrap-operation"
path = "../../../crates/judge-projects-tests/tests/support/execution_child.rs"
test = false
bench = false

[[test]]
name = "execution"
path = "tests/execution.rs"

[[test]]
name = "source"
path = "tests/source.rs"

[[test]]
name = "profile"
path = "tests/profile.rs"

[[test]]
name = "construction"
path = "tests/construction.rs"

[[test]]
name = "original"
path = "tests/original.rs"

[[bin]]
name = "chrono-test-bootstrap-native"
path = "../native/src/main.rs"
test = false
bench = false

[dependencies.serde]
version = "1"
features = ["derive"]

[profile.dev.package.sha2]
opt-level = 3
