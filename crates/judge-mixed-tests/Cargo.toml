[package]
name = "chrono-judge-mixed-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono-judge-filemap = { path = "../judge-filemap" }
chrono-judge-cost = { path = "../judge-cost" }
chrono-judge-mixed = { path = "../judge-mixed" }
chrono-judge-registration = { path = "../judge-registration" }
chrono-identifiers = { path = "../identifiers" }
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
chrono-harness = { path = "../runner" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "chrono-mixed-test-cost"
path = "tests/support/stale_cost.rs"
test = false
bench = false

[profile.dev.package.sha2]
opt-level = 3

[[bin]]
name = "chrono-test-git-model"
path = "../runner-tests/tests/support/git_model.rs"
test = false
bench = false

[[bin]]
name = "chrono-harness-test-cli"
path = "../runner/src/main.rs"
test = false
bench = false

[[bin]]
name = "chrono-judge-registration-test-cli"
path = "../judge-registration/src/main.rs"
test = false
bench = false

[[bin]]
name = "chrono-judge-mixed-test-cli"
path = "../judge-mixed/src/main.rs"
test = false
bench = false

[[bin]]
name = "chrono-judge-cost-test-cli"
path = "../judge-cost/src/main.rs"
test = false
bench = false

[[bin]]
name = "chrono-judge-filemap-test-cli"
path = "../judge-filemap/src/main.rs"
test = false
bench = false
