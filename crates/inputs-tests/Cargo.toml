[package]
name = "chrono-inputs-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
sha1 = "0.10"
chrono-harness = { path = "../runner" }
chrono-inputs = { path = "../inputs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
chrono-worktree = { path = "../worktree", features = ["producer-birth-test"] }
chrono-judge-registration = { path = "../judge-registration" }
tempfile = "3"

[[bin]]
name = "chrono-inputs-test-cli"
path = "../inputs/src/main.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-project-execution"
path = "../judge-projects-tests/tests/support/execution_child.rs"
test = false
bench = false

[[bin]]
name = "chrono-inputs-test-decoder"
path = "tests/support/decoder.rs"
test = false
bench = false

[[bin]]
name = "chrono-inputs-test-historical-decoder"
path = "tests/fixtures/historical_decoder.rs"
test = false
bench = false

[[bin]]
name = "chrono-inputs-test-git"
path = "tests/support/git.rs"
test = false
bench = false

[[bin]]
name = "chrono-inputs-test-record-filemap"
path = "tests/support/record_filemap.rs"
test = false
bench = false

[[bin]]
name = "chrono-inputs-test-zero"
path = "tests/support/zero.rs"
test = false
bench = false

[[test]]
name = "snapshots"
path = "tests/snapshots.rs"

[[test]]
name = "consumer"
path = "tests/consumer.rs"

[[test]]
name = "decoder_contract"
path = "tests/decoder_contract.rs"

[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3

[[bin]]
name = "chrono-test-git-model"
path = "../runner-tests/tests/support/git_model.rs"
test = false
bench = false

[[bin]]
name = "chrono-harness-test-cli"
path = "../runner/src/main.rs"
test = false
bench = false
