[package]
name = "chrono-inputs-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
serde_json = "1"

[dev-dependencies]
chrono-worktree = { path = "../worktree" }
chrono-inputs = { path = "../inputs" }
chrono-harness = { path = "../runner" }
chrono-judge-registration = { path = "../judge-registration" }
tempfile = "3"

[[bin]]
name = "chrono-inputs-test-decoder"
path = "tests/support/decoder.rs"
test = false
bench = false

[[bin]]
name = "chrono-inputs-test-historical-decoder"
path = "tests/fixtures/historical_decoder.rs"
test = false
bench = false

[[bin]]
name = "chrono-inputs-test-git"
path = "tests/support/git.rs"
test = false
bench = false

[[bin]]
name = "chrono-inputs-test-record-filemap"
path = "tests/support/record_filemap.rs"
test = false
bench = false

[[bin]]
name = "chrono-inputs-test-zero"
path = "tests/support/zero.rs"
test = false
bench = false

[[test]]
name = "snapshots"
path = "tests/snapshots.rs"

[[test]]
name = "consumer"
path = "tests/consumer.rs"

[[test]]
name = "decoder_contract"
path = "tests/decoder_contract.rs"

[profile.dev.package.sha2]
opt-level = 3
