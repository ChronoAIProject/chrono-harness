[package]
name = "chrono-judge-registration-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono-harness = { path = "../runner" }
serde_json = "1"

[[bin]]
name = "chrono-test-registration-regression"
path = "tests/support/regression_child.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-registration-git"
path = "../ci-tests/tests/support/git.rs"
test = false
bench = false

[dev-dependencies]
chrono-judge-registration = { path = "../judge-registration" }
tempfile = "3"

[[test]]
name = "registration_contract"
path = "tests/registration_contract.rs"

[[test]]
name = "languages"
path = "tests/languages.rs"

[[test]]
name = "verified_nodes"
path = "tests/verified_nodes.rs"

[[test]]
name = "verified_scheduling"
path = "tests/verified_scheduling.rs"

[[test]]
name = "verified_readiness"
path = "tests/verified_readiness.rs"

[[test]]
name = "verified_input_coverage"
path = "tests/verified_input_coverage.rs"

[profile.dev.package.sha2]
opt-level = 3

[[bin]]
name = "chrono-harness-test-cli"
path = "../runner/src/main.rs"
test = false
bench = false
