[package]
name = "chrono-harness"
version = "0.1.0"
edition = "2024"
publish = false
description = "External judge transport and canonical harness check entry"

[lib]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "chrono-harness"
path = "src/main.rs"
test = false
bench = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
serde_jcs = "=0.2.0"
tempfile = "3"

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
