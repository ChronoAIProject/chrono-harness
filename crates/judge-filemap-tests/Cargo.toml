[package]
name = "chrono-judge-filemap-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono-harness = { path = "../runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
chrono-worktree = { path = "../worktree" }
chrono-judge-filemap = { path = "../judge-filemap" }
chrono-judge-registration = { path = "../judge-registration" }
tempfile = "3"

[[bin]]
name = "chrono-test-project-execution"
path = "../judge-projects-tests/tests/support/execution_child.rs"
test = false
bench = false

[[test]]
name = "impact"
path = "tests/impact.rs"

[[test]]
name = "verified_graph"
path = "tests/verified_graph.rs"

[[test]]
name = "consumer"
path = "tests/consumer.rs"

[[test]]
name = "workflow_selection"
path = "tests/workflow_selection.rs"

[[test]]
name = "workflow_consumer"
path = "tests/workflow_consumer.rs"

[profile.dev.package.sha2]
opt-level = 3
