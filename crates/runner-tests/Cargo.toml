[package]
name = "chrono-harness-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dev-dependencies]
chrono-harness = { path = "../runner" }
serde_json = "1"
tempfile = "3"

[[test]]
name = "cli_contract"
path = "tests/cli_contract.rs"

[[test]]
name = "protocol_v1"
path = "tests/protocol_v1.rs"

[[test]]
name = "registry_snapshot"
path = "tests/registry_snapshot.rs"

[[test]]
name = "parity"
path = "tests/parity.rs"

[[test]]
name = "git_inputs"
path = "tests/git_inputs.rs"

[profile.dev.package.sha2]
opt-level = 3
