[package]
name = "chrono-harness-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono-harness = { path = "../runner" }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "cli_contract"
path = "tests/cli_contract.rs"

[[test]]
name = "protocol_v1"
path = "tests/protocol_v1.rs"

[[test]]
name = "registry_snapshot"
path = "tests/registry_snapshot.rs"

[[test]]
name = "parity"
path = "tests/parity.rs"

[[test]]
name = "git_inputs"
path = "tests/git_inputs.rs"

[profile.dev.package.sha2]
opt-level = 3

[[test]]
name = "process_fds"
path = "tests/process_fds.rs"

[[bin]]
name = "chrono-test-process-lifecycle"
path = "tests/support/process_lifecycle.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-protocol-judge"
path = "tests/support/protocol_judge.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-cli-child"
path = "tests/support/cli_child.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-git-input"
path = "tests/support/git_input.rs"
test = false
bench = false

[[test]]
name = "retention"
path = "tests/retention.rs"

[[bin]]
name = "chrono-test-retention-child"
path = "tests/support/retention_child.rs"
test = false
bench = false
