[package]
name = "chrono-cache-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dev-dependencies]
chrono-harness = { path = "../runner" }
chrono-cache = { path = "../cache" }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[[test]]
name = "keys"
path = "tests/keys.rs"

[[bin]]
name = "chrono-cache-test-probe"
path = "tests/support/probe.rs"
test = false
bench = false

[profile.dev.package.sha2]
opt-level = 3
