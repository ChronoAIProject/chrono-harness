[package]
name = "chrono-worktree-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
shlex = "=2.0.1"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
chrono-worktree = { path = "../worktree", features = ["producer-birth-test"] }
serde_json = "1"
chrono-harness = { path = "../runner" }
chrono-host-bootstrap = { path = "../../.chrono-harness/ci/native" }

[dev-dependencies]
libc = "0.2"
chrono-judge-registration = { path = "../judge-registration" }
tempfile = "3"

[[bin]]
name = "chrono-worktree-test-cli"
path = "../worktree/src/main.rs"
test = false
bench = false

[[bin]]
name = "chrono-harness-test-cli"
path = "../runner/src/main.rs"
test = false
bench = false

[[test]]
name = "creation"
path = "tests/creation.rs"

[[bin]]
name = "chrono-worktree-test-judge"
path = "tests/support/context_judge.rs"
test = false
bench = false

[[bin]]
name = "chrono-worktree-test-consumer"
path = "tests/support/consumer.rs"
test = false
bench = false

[[bin]]
name = "chrono-worktree-test-git"
path = "tests/support/git_fault.rs"
test = false
bench = false

[[bin]]
name = "chrono-worktree-test-hook"
path = "tests/support/hook.rs"
test = false
bench = false

[profile.dev.package.sha2]
opt-level = 3

[[bin]]
name = "chrono-worktree-test-version-probe"
path = "tests/support/version_probe.rs"
test = false
bench = false

[[bin]]
name = "chrono-worktree-owner-publication-probe"
path = "tests/support/owner_publication_probe.rs"
test = false
bench = false

[[bin]]
name = "chrono-worktree-test-bootstrap-native"
path = "../../.chrono-harness/ci/native/src/main.rs"
test = false
bench = false

# Match the runner development profile for the shared inventory implementation.
[profile.dev]
opt-level = 1

[[bin]]
name = "chrono-test-git-model"
path = "../runner-tests/tests/support/git_model.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-cargo-model"
path = "../worktree-tests/tests/support/cargo_model.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-generated-command"
path = "../ci-tests/tests/support/generated_command.rs"
test = false
bench = false
