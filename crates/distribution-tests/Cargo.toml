[package]
name = "chrono-distribution-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
shlex = "=2.0.1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
serde_json = "1"
chrono-distribution = { path = "../distribution" }
chrono-harness = { path = "../runner" }


[[bin]]
name = "chrono-distribution-test-cli"
path = "../distribution/src/main.rs"
test = false
bench = false

[[test]]
name = "installation"
path = "tests/installation.rs"

[[bin]]
name = "distribution-transport-fixture"
path = "tests/support/transport.rs"
test = false
bench = false

[profile.dev.package.sha2]
opt-level = 3

[[bin]]
name = "chrono-test-git-model"
path = "../runner-tests/tests/support/git_model.rs"
test = false
bench = false
