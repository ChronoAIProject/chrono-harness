[package]
name = "chrono-worktree"
version = "0.1.0"
edition = "2024"
publish = false
description = "Explicit host worktree lifecycle operations"

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-worktree"
path = "src/main.rs"
test = false
bench = false

[dependencies]
chrono-harness = { path = "../runner" }
chrono-judge-registration = { path = "../judge-registration" }
chrono-judge-workflow = { path = "../judge-workflow" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
libc = "0.2"
time = { version = "0.3", features = ["formatting"] }

[profile.dev.package.sha2]
opt-level = 3
