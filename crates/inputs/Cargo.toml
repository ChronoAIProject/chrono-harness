[package]
name = "chrono-inputs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Explicit retained input snapshot transport"

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-inputs"
path = "src/main.rs"
test = false
bench = false

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono-harness = { path = "../runner" }
chrono-judge-registration = { path = "../judge-registration" }
chrono-judge-filemap = { path = "../judge-filemap" }
chrono-judge-routes = { path = "../judge-routes" }
serde_json = "1"
tempfile = "3"

[profile.dev.package.sha2]
opt-level = 3
