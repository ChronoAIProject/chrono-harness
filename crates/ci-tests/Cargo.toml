[package]
name = "chrono-ci-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
shlex = "=2.0.1"
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
chrono-worktree = { path = "../worktree", features = ["producer-birth-test"] }
chrono-harness = { path = "../runner" }
chrono-ci = { path = "../ci" }
chrono-judge-ci = { path = "../judge-ci" }
serde_json = { version = "1", features = ["unbounded_depth"] }

[dev-dependencies]
chrono-judge-registration = { path = "../judge-registration" }
tempfile = "3"
serde_yaml_ng = "0.10"
verus_builtin_macros = "=0.0.0-2026-04-20-1748"

[[bin]]
name = "chrono-worktree-test-cli"
path = "../worktree/src/main.rs"
test = false
bench = false

[[bin]]
name = "chrono-ci-test-cli"
path = "../ci/src/main.rs"
test = false
bench = false

[[bin]]
name = "chrono-judge-ci-test-cli"
path = "../judge-ci/src/main.rs"
test = false
bench = false

[[test]]
name = "behavior"
path = "tests/behavior.rs"

[[test]]
name = "initial_projection"
path = "tests/initial_projection.rs"

[[test]]
name = "git_facts"
path = "tests/git_facts.rs"

[[test]]
name = "release"
path = "tests/release.rs"

[[test]]
name = "cache"
path = "tests/cache.rs"

[[test]]
name = "inventory"
path = "tests/inventory.rs"

[[test]]
name = "verified_literals"
path = "tests/verified_literals.rs"

[[test]]
name = "verified_download"
path = "tests/verified_download.rs"

[[bin]]
name = "chrono-ci-test-transport"
path = "tests/support/transport.rs"
test = false
bench = false

[[bin]]
name = "chrono-ci-test-git"
path = "tests/support/git.rs"
test = false
bench = false

[profile.dev]
opt-level = 1
strip = "debuginfo"
debug-assertions = true
overflow-checks = true

[profile.dev.package.sha2]
opt-level = 3

[[bin]]
name = "chrono-test-git-model"
path = "../runner-tests/tests/support/git_model.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-cargo-model"
path = "../worktree-tests/tests/support/cargo_model.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-generated-command"
path = "../ci-tests/tests/support/generated_command.rs"
test = false
bench = false

[[bin]]
name = "chrono-harness-test-cli"
path = "../runner/src/main.rs"
test = false
bench = false
