[package]
name = "chrono-judge-ci-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono-diagnostics = { path = "../diagnostics" }
chrono-judge-ci = { path = "../judge-ci" }
chrono-harness = { path = "../runner" }
libc = "0.2"
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "behavior"
path = "tests/behavior.rs"

[[test]]
name = "verified_collection"
path = "tests/verified_collection.rs"

[profile.dev.package.sha2]
opt-level = 3

[[bin]]
name = "chrono-test-ci-diagnostics"
path = "tests/support/diagnostics_child.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-scoped-git"
path = "../ci-tests/tests/support/git.rs"
test = false
bench = false

[[bin]]
name = "chrono-judge-ci-test-cli"
path = "../judge-ci/src/main.rs"
test = false
bench = false

[[bin]]
name = "chrono-harness-test-cli"
path = "../runner/src/main.rs"
test = false
bench = false
