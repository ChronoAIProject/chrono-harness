[package]
name = "chrono-pr"
version = "0.1.0"
edition = "2024"
publish = false
description = "Head-bound pull request operations for AI callers"

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-pr"
path = "src/main.rs"
test = false
bench = false

[dependencies]
chrono-harness = { path = "../runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package.sha2]
opt-level = 3
