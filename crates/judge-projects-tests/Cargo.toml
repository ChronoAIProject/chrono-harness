[package]
name = "chrono-judge-projects-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
sha1 = "0.10"
sha2 = "0.10"
chrono-diagnostics = { path = "../diagnostics" }
chrono-harness = { path = "../runner" }
chrono-judge-projects = { path = "../judge-projects" }
chrono-judge-ci = { path = "../judge-ci" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "chrono-test-project-execution"
path = "tests/support/execution_child.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-project-execution-driver"
path = "tests/support/execution_driver.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-projects-git"
path = "../ci-tests/tests/support/git.rs"
test = false
bench = false

[[bin]]
name = "chrono-judge-ci-test-cli"
path = "../judge-ci/src/main.rs"
test = false
bench = false

[dev-dependencies]
libc = "0.2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
chrono-worktree = { path = "../worktree", features = ["producer-birth-test"] }
chrono-judge-registration = { path = "../judge-registration" }
chrono-judge-filemap = { path = "../judge-filemap" }
tempfile = "3"
chrono-judge-routes = { path = "../judge-routes" }

[profile.dev.package.sha2]
opt-level = 3

# Registry custody belongs to chrono-worktree; use its production dev optimization.
[profile.dev.package.chrono-worktree]
opt-level = 1

[[bin]]
name = "chrono-test-git-model"
path = "../runner-tests/tests/support/git_model.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-cargo-model"
path = "../worktree-tests/tests/support/cargo_model.rs"
test = false
bench = false

[[bin]]
name = "chrono-harness-test-cli"
path = "../runner/src/main.rs"
test = false
bench = false
