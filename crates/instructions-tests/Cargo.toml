[package]
name = "chrono-instructions-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono-instructions = { path = "../instructions", features = ["test-support"] }
chrono-diagnostics = { path = "../diagnostics" }

[dev-dependencies]
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
chrono-harness = { path = "../runner", features = ["retention-test"] }
tempfile = "3"
serde_json = "1"

[[test]]
name = "generation"
path = "tests/generation.rs"

[[bin]]
name = "chrono-test-instructions"
path = "../instructions/src/main.rs"
test = false
bench = false

[[test]]
name = "publication_decision"
path = "tests/publication_decision.rs"
