[package]
name = "chrono-distribution"
version = "0.1.0"
edition = "2024"
publish = false
description = "Explicit binary release packaging and pinned host installation"

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-distribution"
path = "src/main.rs"
test = false
bench = false

[dependencies]
chrono-harness = { path = "../runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

