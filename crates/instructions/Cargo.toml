[package]
name = "chrono-instructions"
version = "0.1.0"
edition = "2024"
publish = false
description = "Explicit, preserving host instruction generation"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)", "cfg(verus_keep_ghost_body)"] }

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-instructions"
path = "src/main.rs"
test = false
bench = false

[features]
test-support = []

[dependencies]
chrono-diagnostics = { path = "../diagnostics" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
chrono-harness = { path = "../runner" }
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
libc = "0.2"
