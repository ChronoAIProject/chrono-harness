[package]
name = "chrono-instructions"
version = "0.1.0"
edition = "2024"
publish = false
description = "Explicit, preserving host instruction generation"

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-instructions"
path = "src/main.rs"
test = false
bench = false

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.dev.package.sha2]
opt-level = 3
