[package]
name = "chrono-judge-ci"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-judge-ci"
path = "src/main.rs"
test = false
bench = false

[dependencies]
chrono-judge-registration = { path = "../judge-registration" }
chrono-judge-routes = { path = "../judge-routes" }
chrono-judge-projects = { path = "../judge-projects" }
chrono-judge-filemap = { path = "../judge-filemap" }
chrono-harness = { path = "../runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package.sha2]
opt-level = 3
