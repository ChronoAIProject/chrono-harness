[package]
name = "chrono-judge-routes"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-judge-routes"
path = "src/main.rs"
test = false
bench = false

[dependencies]
chrono-harness = { path = "../runner" }
chrono-judge-registration = { path = "../judge-registration" }
chrono-judge-filemap = { path = "../judge-filemap" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Independent judge roots also compile the shared evidence consumers.
[profile.dev]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.dev.package.sha2]
opt-level = 3
