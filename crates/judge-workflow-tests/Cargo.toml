[package]
name = "chrono-judge-workflow-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[[bin]]
name = "chrono-workflow-test-tool"
path = "tests/support/native_tool.rs"
test = false
bench = false

[dependencies]
chrono-judge-cost = { path = "../judge-cost" }
chrono-judge-mixed = { path = "../judge-mixed" }
chrono-judge-registration = { path = "../judge-registration" }
chrono-identifiers = { path = "../identifiers" }
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
shlex = "=2.0.1"
sha1 = "0.10"
sha2 = "0.10"
chrono-judge-workflow = { path = "../judge-workflow" }
chrono-worktree = { path = "../worktree", features = ["producer-birth-test"] }
chrono-harness = { path = "../runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "chrono-test-project-execution"
path = "../judge-projects-tests/tests/support/execution_child.rs"
test = false
bench = false

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "chrono-judge-workflow-test-cli"
path = "../judge-workflow/src/main.rs"
test = false
bench = false

[[bin]]
name = "chrono-worktree-test-cli"
path = "../worktree/src/main.rs"
test = false
bench = false

[[test]]
name = "branch"
path = "tests/branch.rs"

[[test]]
name = "consumer"
path = "tests/consumer.rs"

[[test]]
name = "verified_evidence"
path = "tests/verified_evidence.rs"

[[test]]
name = "verified_execution"
path = "tests/verified_execution.rs"

[[test]]
name = "verified_certificate"
path = "tests/verified_certificate.rs"

[[test]]
name = "verified_transition"
path = "tests/verified_transition.rs"

# Original-receipt fixtures reconstruct and reseal the judge DAG in process.
# Path dependencies use this consumer root's profile.
[profile.dev]
opt-level = 1
strip = "debuginfo"
debug-assertions = true
overflow-checks = true

[profile.dev.package.sha2]
opt-level = 3

[[bin]]
name = "chrono-test-git-model"
path = "../runner-tests/tests/support/git_model.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-cargo-model"
path = "../worktree-tests/tests/support/cargo_model.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-generated-command"
path = "../ci-tests/tests/support/generated_command.rs"
test = false
bench = false

[[bin]]
name = "chrono-harness-test-cli"
path = "../runner/src/main.rs"
test = false
bench = false

[[bin]]
name = "chrono-judge-registration-test-cli"
path = "../judge-registration/src/main.rs"
test = false
bench = false

[[bin]]
name = "chrono-judge-mixed-test-cli"
path = "../judge-mixed/src/main.rs"
test = false
bench = false

[[bin]]
name = "chrono-judge-cost-test-cli"
path = "../judge-cost/src/main.rs"
test = false
bench = false
