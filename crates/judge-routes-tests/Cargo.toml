[package]
name = "chrono-judge-routes-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde_json = "1"

[dev-dependencies]
chrono-judge-routes = { path = "../judge-routes" }
chrono-harness = { path = "../runner" }
chrono-judge-registration = { path = "../judge-registration" }
chrono-judge-filemap = { path = "../judge-filemap" }
tempfile = "3"

[[bin]]
name = "chrono-judge-routes-test-tool"
path = "tests/support/tool.rs"
test = false
bench = false

[profile.dev.package.sha2]
opt-level = 3
