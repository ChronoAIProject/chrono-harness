[package]
name = "chrono-pr-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono-pr = { path = "../pr" }
chrono-harness = { path = "../runner" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
libc = "0.2"

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"

[[bin]]
name = "chrono-pr-test-cli"
path = "../pr/src/main.rs"
test = false
bench = false

[[bin]]
name = "chrono-pr-test-gh"
path = "tests/support/gh.rs"
test = false
bench = false

# 与真实 runner 的开发配置一致；保留调试断言及原行为时限。
[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3
