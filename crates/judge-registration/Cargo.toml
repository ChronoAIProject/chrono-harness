[package]
name = "chrono-judge-registration"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "chrono-judge-registration"
path = "src/main.rs"
test = false
bench = false

[dependencies]
chrono-harness = { path = "../runner" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
time = { version = "=0.3.47", features = ["parsing"] }

# Independent judge roots also compile the shared evidence consumers.
[profile.dev]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.dev.package.sha2]
opt-level = 3
