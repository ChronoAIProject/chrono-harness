[package]
name = "chrono-diagnostics"
version = "0.1.0"
edition = "2024"
publish = false
description = "Shared structured diagnostics and explicit error records"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)", "cfg(verus_keep_ghost_body)"] }

[lib]
test = false
doctest = false

[dependencies]
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
