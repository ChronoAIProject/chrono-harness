[package]
name = "chrono-judge-cargo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-judge-cargo"
path = "src/main.rs"
test = false
bench = false

[dependencies]
chrono-harness = { path = "../runner" }
chrono-judge-registration = { path = "../judge-registration" }
chrono-judge-filemap = { path = "../judge-filemap" }
chrono-judge-routes = { path = "../judge-routes" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# The guarded development binary validates complete toolchain/SDK inventories
# at every boundary, just as the other inventory judges do.
[profile.dev]
opt-level = 1

[profile.dev.package.sha2]
opt-level = 3
